[package]
name          = "batty-cat"
version       = "0.15.0"
edition       = "2021"
rust-version  = "1.86"
authors       = ["Thomas Björk <codedv8@gmail.com>"]
description   = "A cat clone with syntax highlighting, git integration, and Rhai support"
license       = "MIT"
readme        = "README.md"
repository    = "https://github.com/codedeviate/batty"
homepage      = "https://github.com/codedeviate/batty"
documentation = "https://docs.rs/batty-cat"
keywords      = ["cat", "bat", "syntax-highlighting", "cli", "terminal"]
categories    = ["command-line-utilities"]
exclude       = [
    ".claude/",
    ".github/",
    ".gitignore",
    ".git/",
    ".idea/",
    "CLAUDE.md",
    "OUT-OF-SCOPE.md",
]

[[bin]]
name = "batty"
path = "src/main.rs"

[dependencies]
clap          = { version = "4", features = ["derive", "env"] }
syntect       = { version = "5", default-features = false, features = ["parsing", "regex-onig", "yaml-load"] }
two-face      = "0.4"
git2          = { version = "0.19", default-features = false }
pager         = "0.16"
anstyle       = "1"
anstyle-query = "1"
dirs          = "5"
anyhow        = "1"
crossterm = "0.28"
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
termimad = "0.34"
unicode-width = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
